name: Notification digests

on:
  schedule:
    - cron: "0 13 * * *"   # daily digest, every day at 13:00 UTC
    - cron: "0 13 * * 1"   # weekly digest, Mondays at 13:00 UTC
  workflow_dispatch:
    inputs:
      frequency:
        description: "Digest to send"
        type: choice
        options: [daily, weekly]
        default: daily

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/worker/requirements.txt

      - run: pip install -r requirements.txt

      - name: Pick frequency from the trigger
        id: frequency
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.frequency }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 13 * * 1" ]; then
            echo "value=weekly" >> "$GITHUB_OUTPUT"
          else
            echo "value=daily" >> "$GITHUB_OUTPUT"
          fi

      - run: python notifier.py --frequency "${{ steps.frequency.outputs.value }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
